name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_ROUTER_MODE: hash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate public Supabase configuration
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.VITE_SUPABASE_URL || 'http://missing.invalid');
          const key = process.env.VITE_SUPABASE_ANON_KEY || '';
          let publicKey = key.startsWith('sb_publishable_');
          if (!publicKey) {
            try {
              publicKey = JSON.parse(Buffer.from(key.split('.')[1], 'base64url')).role === 'anon';
            } catch {}
          }
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.supabase.co') || !publicKey) {
            throw new Error('Set VITE_SUPABASE_URL and an anon/publishable key in repository Actions variables. Never use a service_role or secret key.');
          }
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
